<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Data App</title>

    <link rel="icon" type="image/png"
      href="{{ url_for('static', filename='logo.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .ordenable {
            cursor: pointer;
        }

        /* =========================
           MODO OSCURO
           ========================= */

        body.modo-oscuro {
            background-color: #212529 !important;
            color: #f8f9fa !important;
        }

        body.modo-oscuro .card {
            background-color: #343a40 !important;
            color: #f8f9fa !important;
            border-color: #495057 !important;
        }

        body.modo-oscuro .form-control {
            background-color: #343a40 !important;
            color: #f8f9fa !important;
            border-color: #6c757d !important;
        }

        body.modo-oscuro .form-control::placeholder {
            color: #adb5bd !important;
        }

        /* Tabla */

        body.modo-oscuro .table {
            --bs-table-bg: #343a40;
            --bs-table-color: #f8f9fa;
            --bs-table-striped-bg: #3e444a;
            --bs-table-hover-bg: #495057;
            --bs-table-border-color: #6c757d;
        }

        body.modo-oscuro .table > :not(caption) > * > * {
            color: #f8f9fa;
        }

        /* Paginación */

        body.modo-oscuro .pagination .page-link {
            background-color: #343a40;
            color: #f8f9fa;
            border-color: #6c757d;
        }

        body.modo-oscuro .pagination .active .page-link {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }

        /* Títulos */

        body.modo-oscuro h1,
        body.modo-oscuro h2,
        body.modo-oscuro h3,
        body.modo-oscuro h4,
        body.modo-oscuro h5,
        body.modo-oscuro h6 {
            color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4 text-center">
        📊 Data App
    </h1>

    <div class="d-flex justify-content-end mb-3">
        <button id="modoOscuro" class="btn btn-dark">
            🌙 Modo oscuro
        </button>
    </div>
    <div class="row text-center mb-4">

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Total usuarios</h6>
                <h2 id="total-usuarios">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Edad promedio</h6>
                <h2 id="edad-promedio">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Ciudades</h6>
                <h2 id="total-ciudades">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Mayor edad</h6>
                <h2 id="mayor-edad">0</h2>
            </div>
        </div>
    </div>

    </div>

    <div class="row mb-4">

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Usuarios por ciudad</h5>
                    <canvas id="graficoCiudades"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Distribución por ciudad</h5>
                    <canvas id="graficoTorta"></canvas>
                </div>
            </div>
        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-12">
            <div class="card shadow-sm mb-5">
                <div class="card-body">
                    <h5>Distribución de edades</h5>
                    <canvas id="graficoEdades"></canvas>
                </div>
            </div>
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-6">
            <input
                type="text"
                id="buscador-nombre"
                class="form-control"
                placeholder="Buscar por nombre...">
        </div>

        <div class="col-md-6">
            <input
                type="text"
                id="buscador-ciudad"
                class="form-control"
                placeholder="Buscar por ciudad...">
        </div>

    </div>

    <h3 class="mt-4" id="titulo-formulario">
        Agregar usuario
    </h3>

    <div class="row g-2 mb-4">
        <div class="col">
            <input type="text" id="nombre" class="form-control" placeholder="Nombre">
        </div>

        <div class="col">
            <input type="number" id="edad" class="form-control" placeholder="Edad">
        </div>

        <div class="col">
            <input type="text" id="ciudad" class="form-control" placeholder="Ciudad">
        </div>

        <div class="col-auto">
            <button class="btn btn-success" id="agregar">
                Agregar
            </button>
        </div>

        <div class="col-auto">
            <button class="btn btn-primary" id="exportar">
                📄 Exportar CSV
            </button>
        </div>

        <div class="col-auto">
            <button class="btn btn-secondary d-none" id="cancelar"> 
                Cancelar
            </button>
        </div>
    </div>

    <table class="table table-striped table-hover table-bordered shadow-sm" id="tabla">

        <thead class="table-dark">

            <tr>
                <th id="th-id" class="ordenable" onclick="ordenar('id')">
                    ID
                </th>
                <th id="th-nombre" class="ordenable" onclick="ordenar('nombre')">
                    Nombre
                </th>
                <th id="th-edad" class="ordenable" onclick="ordenar('edad')">
                    Edad
                </th>
                <th id="th-ciudad" class="ordenable" onclick="ordenar('ciudad')">
                    Ciudad
                </th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>
            <div class="toast-container position-fixed bottom-0 end-0 p-3">

                <div id="toastMensaje"
                    class="toast"
                    role="alert">

                    <div class="toast-header">

                        <strong class="me-auto" id="toastTitulo">
                            Mensaje
                        </strong>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="toast">
                        </button>

                    </div>

                    <div class="toast-body" id="toastTexto">

                    </div>

                </div>

            </div>

        </tbody>

    </table>

    <nav class="mt-3">
        <ul class="pagination justify-content-center" id="paginacion"></ul>
    </nav>

</div>

<!-- Modal eliminar usuario -->
<div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Eliminar usuario</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar">
                </button>
            </div>

            <div class="modal-body">
                ¿Está seguro de que desea eliminar este usuario?
            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button
                    type="button"
                    class="btn btn-danger"
                    id="confirmarEliminar">
                    Eliminar
                </button>

            </div>

        </div>
    </div>

</div>

<script>
let datos = [];
let ordenActual = {
    columna: "",
    asc: true
};
let usuarioEditando = null;
let graficoCiudades = null;
let graficoTorta = null;
let graficoEdades;
let usuarios = [];
let paginaActual = 1;
const filasPorPagina = 5;

fetch("/data")
    .then(response => response.json())
    .then(data => {
        datos = data;
        mostrarDatos(data);
        actualizarPaginacion(data);
        actualizarDashboard(data);
        actualizarGraficos(data);
        actualizarGraficoEdades(data);
    });

function limpiarFormulario() {

    document.querySelector("#nombre").value = "";
    document.querySelector("#edad").value = "";
    document.querySelector("#ciudad").value = "";

    document.querySelector("#nombre").focus();

}

function mostrarDatos(lista) {
    const tabla = document.querySelector("#tabla tbody");
    tabla.innerHTML = "";

    const inicio = (paginaActual - 1) * filasPorPagina;
    const fin = inicio + filasPorPagina;

    const usuariosPagina = lista.slice(inicio, fin);

    usuariosPagina.forEach(usuario => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${usuario.id}</td>
            <td>${usuario.nombre}</td>
            <td>${usuario.edad}</td>
            <td>${usuario.ciudad}</td>

            <td>
                <button
                    class="btn btn-warning btn-sm editar"
                    data-id="${usuario.id}">
                    ✏️
                </button>
                <button
                    class="btn btn-danger btn-sm eliminar"
                    data-id="${usuario.id}">
                    🗑️
                </button>
            </td>
        `;

        tabla.appendChild(fila);
    });

    document.querySelectorAll(".eliminar").forEach(boton => {

        boton.addEventListener("click", () => {

            const id = boton.dataset.id;

            const modal = new bootstrap.Modal(
                document.querySelector("#modalEliminar")
            );

            modal.show();

            document.querySelector("#confirmarEliminar").onclick = () => {

                fetch(`/eliminar/${id}`, {
                    method: "DELETE"
                })
                .then(() => fetch("/data"))
                .then(res => res.json())
                .then(data => {

                    datos = data;

                    mostrarDatos(datos);
                    actualizarPaginacion(datos);
                    actualizarDashboard(datos);
                    actualizarGraficos(datos);
                    actualizarGraficoEdades(datos);

                    modal.hide();

                    mostrarToast(
                        "Éxito",
                        "Usuario eliminado correctamente."
                    );

                });

            };

        });

    });
    
    document.querySelectorAll(".editar").forEach(boton => {

    boton.addEventListener("click", () => {

        const id = Number(boton.dataset.id);

        const usuario = datos.find(u => u.id === id);

        document.querySelector("#nombre").value = usuario.nombre;
        document.querySelector("#edad").value = usuario.edad;
        document.querySelector("#ciudad").value = usuario.ciudad;

        usuarioEditando = id;

        document.querySelector("#titulo-formulario").textContent = "Editar usuario";
        document.querySelector("#agregar").textContent = "Guardar cambios";
        document.querySelector("#agregar").classList.remove("btn-success");
        document.querySelector("#agregar").classList.add("btn-warning");
        document.querySelector("#cancelar").classList.remove("d-none");
        document.querySelector("#nombre").focus();
    });

}); 
}

function actualizarDashboard(lista) {

    document.querySelector("#total-usuarios").textContent = lista.length;

    const promedio =
        lista.reduce((suma, u) => suma + u.edad, 0) / lista.length || 0;

    document.querySelector("#edad-promedio").textContent =
        promedio.toFixed(1);

    const ciudades = new Set(lista.map(u => u.ciudad));

    document.querySelector("#total-ciudades").textContent =
        ciudades.size;

    const mayor = Math.max(...lista.map(u => u.edad), 0);

    document.querySelector("#mayor-edad").textContent = mayor;

}

function actualizarGraficos(lista) {

    // Contar usuarios por ciudad
    const ciudades = {};

    lista.forEach(usuario => {
        if (ciudades[usuario.ciudad]) {
            ciudades[usuario.ciudad]++;
        } else {
            ciudades[usuario.ciudad] = 1;
        }
    });

    const labels = Object.keys(ciudades);
    const valores = Object.values(ciudades);

    // Destruir gráficos anteriores
    if (graficoCiudades) {
        graficoCiudades.destroy();
    }

    if (graficoTorta) {
        graficoTorta.destroy();
    }

    // ===== Gráfico de barras =====
    graficoCiudades = new Chart(
        document.getElementById("graficoCiudades"),
        {
            type: "bar",
            data: {
                labels: labels,
                datasets: [{
                    label: "Usuarios",
                    data: valores
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        }
    );

    // ===== Gráfico de torta =====
    graficoTorta = new Chart(
        document.getElementById("graficoTorta"),
        {
            type: "pie",
            data: {
                labels: labels,
                datasets: [{
                    data: valores
                }]
            },
            options: {
                responsive: true
            }
        }
    );
}

function actualizarGraficoEdades(lista){

    let rangos = {
        "18-29":0,
        "30-39":0,
        "40-49":0,
        "50-59":0,
        "60+":0
    };

    lista.forEach(usuario => {

        if(usuario.edad <= 29)
            rangos["18-29"]++;

        else if(usuario.edad <= 39)
            rangos["30-39"]++;

        else if(usuario.edad <= 49)
            rangos["40-49"]++;

        else if(usuario.edad <= 59)
            rangos["50-59"]++;

        else
            rangos["60+"]++;

    });

    if(graficoEdades){
        graficoEdades.destroy();
    }

    graficoEdades = new Chart(
        document.getElementById("graficoEdades"),
        {
            type:"bar",

            data:{
                labels:Object.keys(rangos),

                datasets:[{
                    label:"Usuarios",

                    data:Object.values(rangos)
                }]
            },

            options:{
                responsive:true
            }
        }
    );

}

function filtrar() {
    const nombre = document.querySelector("#buscador-nombre").value.trim().toLowerCase();
    const ciudad = document.querySelector("#buscador-ciudad").value.trim().toLowerCase();

    const filtrados = datos.filter(u =>
    (nombre === "" || u.nombre.toLowerCase().startsWith(nombre)) &&
    (ciudad === "" || u.ciudad.toLowerCase().startsWith(ciudad))
    );

    mostrarDatos(filtrados);
    actualizarPaginacion(filtrados);
    actualizarDashboard(filtrados);
    actualizarGraficos(filtrados);
    actualizarGraficoEdades(filtrados);
}

document.querySelector("#buscador-nombre").addEventListener("input", filtrar);
document.querySelector("#buscador-ciudad").addEventListener("input", filtrar);
document.querySelector("#agregar").addEventListener("click", () => {

    const nombre = document.querySelector("#nombre").value;
    const edad = document.querySelector("#edad").value;
    const ciudad = document.querySelector("#ciudad").value;

    if (!nombre || !edad || !ciudad) {
        mostrarToast(
            "Error",
            "Debe completar todos los campos."
        );
        return;
    }

    if (nombre.trim().length < 2) {
        mostrarToast(
            "Error",
            "El nombre debe tener al menos 2 caracteres."
        );
        return;
    }

    if (!Number.isInteger(Number(edad)) || edad < 0 || edad > 120) {
        mostrarToast(
            "Error",
            "La edad debe ser un número entre 0 y 120."
        );
        return;
    }

    if (ciudad.trim().length < 2) {
        mostrarToast(
            "Error",
            "La ciudad debe tener al menos 2 caracteres."
        );
        return;
    }

    if (usuarioEditando !== null) {

    fetch(`/editar/${usuarioEditando}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nombre,
            edad,
            ciudad
        })

    })
    .then(() => fetch("/data"))
    .then(res => res.json())
    .then(data => {

        datos = data;
        mostrarDatos(datos);
        actualizarPaginacion(datos);    
        actualizarDashboard(datos);
        actualizarGraficos(datos);
        actualizarGraficoEdades(datos);
        mostrarToast(
            "Éxito",
            "Usuario actualizado correctamente."
        );

        usuarioEditando = null;
        document.querySelector("#titulo-formulario").textContent = "Agregar usuario";
        limpiarFormulario();

        document.querySelector("#agregar").textContent = "Agregar";
        document.querySelector("#agregar").classList.remove("btn-warning");
        document.querySelector("#agregar").classList.add("btn-success");
        document.querySelector("#cancelar").classList.remove("d-none");

    });

    return;
    }

    fetch("/agregar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nombre,
            edad,
            ciudad
        })

    })
    .then(res => res.json())
    .then(() => {

        return fetch("/data");

    })
    .then(res => res.json())
    .then(data => {

        datos = data;
        mostrarDatos(datos);
        actualizarPaginacion(datos);
        actualizarDashboard(datos);
        actualizarGraficos(datos);
        actualizarGraficoEdades(datos);
        limpiarFormulario();
        mostrarToast(
            "Éxito",
            "Usuario agregado correctamente."
        );

    });

});

document.querySelector("#cancelar").addEventListener("click", () => {

    usuarioEditando = null;

    limpiarFormulario();

    document.querySelector("#agregar").textContent = "Agregar";
    document.querySelector("#agregar").classList.remove("btn-warning");
    document.querySelector("#agregar").classList.add("btn-success");

    document.querySelector("#cancelar").classList.add("d-none");
    document.querySelector("#titulo-formulario").textContent = "Agregar usuario";

});

function ordenar(columna) {

    if (ordenActual.columna === columna) {
        ordenActual.asc = !ordenActual.asc;
    } else {
        ordenActual.columna = columna;
        ordenActual.asc = true;
    }

    datos.sort((a, b) => {

        if (a[columna] < b[columna])
            return ordenActual.asc ? -1 : 1;

        if (a[columna] > b[columna])
            return ordenActual.asc ? 1 : -1;

        return 0;
    });

    filtrar();
    actualizarFlechas();
}

function actualizarFlechas() {

    document.querySelector("#th-id").textContent = "ID";
    document.querySelector("#th-nombre").textContent = "Nombre";
    document.querySelector("#th-edad").textContent = "Edad";
    document.querySelector("#th-ciudad").textContent = "Ciudad";

    if (ordenActual.columna !== "") {

        const flecha = ordenActual.asc ? " ▲" : " ▼";

        document.querySelector("#th-" + ordenActual.columna).textContent += flecha;
    }
}

document.querySelector("#exportar").addEventListener("click", () => {
    window.location.href = "/export/csv";
});

function mostrarToast(titulo, mensaje){

    document.querySelector("#toastTitulo").textContent = titulo;
    document.querySelector("#toastTexto").textContent = mensaje;

    const toast = new bootstrap.Toast(
        document.querySelector("#toastMensaje")
    );

    toast.show();
}

function actualizarPaginacion(datos) {

    const totalPaginas = Math.ceil(datos.length / filasPorPagina);

    const contenedor = document.getElementById("paginacion");
    contenedor.innerHTML = "";

    for (let i = 1; i <= totalPaginas; i++) {

        const li = document.createElement("li");
        li.className = "page-item";

        if (i === paginaActual)
            li.classList.add("active");

        li.innerHTML = `
            <a class="page-link" href="#">${i}</a>
        `;

        li.onclick = function(e) {

            e.preventDefault();

            paginaActual = i;

            mostrarDatos(datos);
            actualizarPaginacion(datos);

        };

        contenedor.appendChild(li);

    }

}

const botonModoOscuro = document.querySelector("#modoOscuro");

botonModoOscuro.addEventListener("click", () => {

    document.body.classList.toggle("modo-oscuro");

    if (document.body.classList.contains("modo-oscuro")) {

        botonModoOscuro.textContent = "☀️ Modo claro";
        botonModoOscuro.classList.remove("btn-dark");
        botonModoOscuro.classList.add("btn-light");

        localStorage.setItem("modoOscuro", "true");

    } else {

        botonModoOscuro.textContent = "🌙 Modo oscuro";
        botonModoOscuro.classList.remove("btn-light");
        botonModoOscuro.classList.add("btn-dark");

        localStorage.setItem("modoOscuro", "false");
    }
});

if (localStorage.getItem("modoOscuro") === "true") {

    document.body.classList.add("modo-oscuro");

    botonModoOscuro.textContent = "☀️ Modo claro";
    botonModoOscuro.classList.remove("btn-dark");
    botonModoOscuro.classList.add("btn-light");
}
</script>

</body>
</html>
