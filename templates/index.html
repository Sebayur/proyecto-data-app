<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Data App</title>

    <link rel="icon" type="image/png"
      href="{{ url_for('static', filename='logo.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4 text-center">
        📊 Data App
    </h1>

    <div class="row text-center mb-4">

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Total usuarios</h6>
                <h2 id="total-usuarios">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Edad promedio</h6>
                <h2 id="edad-promedio">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Ciudades</h6>
                <h2 id="total-ciudades">0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Mayor edad</h6>
                <h2 id="mayor-edad">0</h2>
            </div>
        </div>
    </div>

</div>

    <div class="row mb-4">

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Usuarios por ciudad</h5>
                    <canvas id="graficoCiudades"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Distribución por ciudad</h5>
                    <canvas id="graficoTorta"></canvas>
                </div>
            </div>
        </div>

    </div>

    <div class="row mt-4">

        <div class="col-md-12">
            <div class="card shadow-sm mb-5">
                <div class="card-body">
                    <h5>Distribución de edades</h5>
                    <canvas id="graficoEdades"></canvas>
                </div>
            </div>
        </div>

    </div>

    <div class="row mb-3">

        <div class="col-md-6">
            <input
                type="text"
                id="buscador-nombre"
                class="form-control"
                placeholder="Buscar por nombre...">
        </div>

        <div class="col-md-6">
            <input
                type="text"
                id="buscador-ciudad"
                class="form-control"
                placeholder="Buscar por ciudad...">
        </div>

    </div>

    <h3 class="mt-4" id="titulo-formulario">
        Agregar usuario
    </h3>

    <div class="row g-2 mb-4">
        <div class="col">
            <input type="text" id="nombre" class="form-control" placeholder="Nombre">
        </div>

        <div class="col">
            <input type="number" id="edad" class="form-control" placeholder="Edad">
        </div>

        <div class="col">
            <input type="text" id="ciudad" class="form-control" placeholder="Ciudad">
        </div>

        <div class="col-auto">
            <button class="btn btn-success" id="agregar">
                Agregar
            </button>
        </div>

        <div class="col-auto">
            <button class="btn btn-secondary d-none" id="cancelar"> 
                Cancelar
            </button>
        </div>
    </div>

    <table class="table table-striped table-hover table-bordered shadow-sm" id="tabla">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Ciudad</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

</div>

<script>
let datos = [];
let usuarioEditando = null;
let graficoCiudades = null;
let graficoTorta = null;
let graficoEdades;

fetch("/data")
    .then(response => response.json())
    .then(data => {
        datos = data;
        mostrarDatos(data);
        actualizarDashboard(data);
        actualizarGraficos(data);
        actualizarGraficoEdades(data);
    });

function limpiarFormulario() {

    document.querySelector("#nombre").value = "";
    document.querySelector("#edad").value = "";
    document.querySelector("#ciudad").value = "";

    document.querySelector("#nombre").focus();

}

function mostrarDatos(lista) {
    const tabla = document.querySelector("#tabla tbody");
    tabla.innerHTML = "";

    lista.forEach(usuario => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${usuario.id}</td>
            <td>${usuario.nombre}</td>
            <td>${usuario.edad}</td>
            <td>${usuario.ciudad}</td>

            <td>
                <button
                    class="btn btn-warning btn-sm editar"
                    data-id="${usuario.id}">
                    ✏️
                </button>
                <button
                    class="btn btn-danger btn-sm eliminar"
                    data-id="${usuario.id}">
                    🗑️
                </button>
            </td>
        `;

        tabla.appendChild(fila);
    });

    document.querySelectorAll(".eliminar").forEach(boton => { // Los botones 🗑️ se crean cada vez que redibujamos la tabla.

    boton.addEventListener("click", () => {

        const id = boton.dataset.id;

        if (!confirm("¿Eliminar este usuario?")) {
            return;
        }

        fetch(`/eliminar/${id}`, {

            method: "DELETE"

        })
        .then(() => fetch("/data"))
        .then(res => res.json())
        .then(data => {

            datos = data;
            mostrarDatos(datos);
            actualizarDashboard(datos);
            actualizarGraficos(datos);
            actualizarGraficoEdades(datos);

        });

    });

});
    
    document.querySelectorAll(".editar").forEach(boton => {

    boton.addEventListener("click", () => {

        const id = Number(boton.dataset.id);

        const usuario = datos.find(u => u.id === id);

        document.querySelector("#nombre").value = usuario.nombre;
        document.querySelector("#edad").value = usuario.edad;
        document.querySelector("#ciudad").value = usuario.ciudad;

        usuarioEditando = id;

        document.querySelector("#titulo-formulario").textContent = "Editar usuario";
        document.querySelector("#agregar").textContent = "Guardar cambios";
        document.querySelector("#agregar").classList.remove("btn-success");
        document.querySelector("#agregar").classList.add("btn-warning");
        document.querySelector("#cancelar").classList.remove("d-none");
        document.querySelector("#nombre").focus();
    });

}); 
}

function actualizarDashboard(lista) {

    document.querySelector("#total-usuarios").textContent = lista.length;

    const promedio =
        lista.reduce((suma, u) => suma + u.edad, 0) / lista.length || 0;

    document.querySelector("#edad-promedio").textContent =
        promedio.toFixed(1);

    const ciudades = new Set(lista.map(u => u.ciudad));

    document.querySelector("#total-ciudades").textContent =
        ciudades.size;

    const mayor = Math.max(...lista.map(u => u.edad), 0);

    document.querySelector("#mayor-edad").textContent = mayor;

}

function actualizarGraficos(lista) {

    // Contar usuarios por ciudad
    const ciudades = {};

    lista.forEach(usuario => {
        if (ciudades[usuario.ciudad]) {
            ciudades[usuario.ciudad]++;
        } else {
            ciudades[usuario.ciudad] = 1;
        }
    });

    const labels = Object.keys(ciudades);
    const valores = Object.values(ciudades);

    // Destruir gráficos anteriores
    if (graficoCiudades) {
        graficoCiudades.destroy();
    }

    if (graficoTorta) {
        graficoTorta.destroy();
    }

    // ===== Gráfico de barras =====
    graficoCiudades = new Chart(
        document.getElementById("graficoCiudades"),
        {
            type: "bar",
            data: {
                labels: labels,
                datasets: [{
                    label: "Usuarios",
                    data: valores
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        }
    );

    // ===== Gráfico de torta =====
    graficoTorta = new Chart(
        document.getElementById("graficoTorta"),
        {
            type: "pie",
            data: {
                labels: labels,
                datasets: [{
                    data: valores
                }]
            },
            options: {
                responsive: true
            }
        }
    );
}

function actualizarGraficoEdades(lista){

    let rangos = {
        "18-29":0,
        "30-39":0,
        "40-49":0,
        "50-59":0,
        "60+":0
    };

    lista.forEach(usuario => {

        if(usuario.edad <= 29)
            rangos["18-29"]++;

        else if(usuario.edad <= 39)
            rangos["30-39"]++;

        else if(usuario.edad <= 49)
            rangos["40-49"]++;

        else if(usuario.edad <= 59)
            rangos["50-59"]++;

        else
            rangos["60+"]++;

    });

    if(graficoEdades){
        graficoEdades.destroy();
    }

    graficoEdades = new Chart(
        document.getElementById("graficoEdades"),
        {
            type:"bar",

            data:{
                labels:Object.keys(rangos),

                datasets:[{
                    label:"Usuarios",

                    data:Object.values(rangos)
                }]
            },

            options:{
                responsive:true
            }
        }
    );

}

function filtrar() {
    const nombre = document.querySelector("#buscador-nombre").value.trim().toLowerCase();
    const ciudad = document.querySelector("#buscador-ciudad").value.trim().toLowerCase();

    const filtrados = datos.filter(u =>
    (nombre === "" || u.nombre.toLowerCase().startsWith(nombre)) &&
    (ciudad === "" || u.ciudad.toLowerCase().startsWith(ciudad))
    );

    mostrarDatos(filtrados);
    actualizarDashboard(filtrados);
    actualizarGraficos(filtrados);
    actualizarGraficoEdades(filtrados);
}

document.querySelector("#buscador-nombre").addEventListener("input", filtrar);
document.querySelector("#buscador-ciudad").addEventListener("input", filtrar);
document.querySelector("#agregar").addEventListener("click", () => {

    const nombre = document.querySelector("#nombre").value;
    const edad = document.querySelector("#edad").value;
    const ciudad = document.querySelector("#ciudad").value;

    if (!nombre || !edad || !ciudad) {
        alert("Debe completar todos los campos.");
        return;
    }

    if (edad < 0 || edad > 120) {
        alert("Ingrese una edad válida.");
        return;
    }

    if (usuarioEditando !== null) {

    fetch(`/editar/${usuarioEditando}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nombre,
            edad,
            ciudad
        })

    })
    .then(() => fetch("/data"))
    .then(res => res.json())
    .then(data => {

        datos = data;
        mostrarDatos(datos);
        actualizarDashboard(datos);
        actualizarGraficos(datos);
        actualizarGraficoEdades(datos);

        usuarioEditando = null;
        document.querySelector("#titulo-formulario").textContent = "Agregar usuario";
        limpiarFormulario();

        document.querySelector("#agregar").textContent = "Agregar";
        document.querySelector("#agregar").classList.remove("btn-warning");
        document.querySelector("#agregar").classList.add("btn-success");
        document.querySelector("#cancelar").classList.remove("d-none");

    });

    return;
    }

    fetch("/agregar", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nombre,
            edad,
            ciudad
        })

    })
    .then(res => res.json())
    .then(() => {

        return fetch("/data");

    })
    .then(res => res.json())
    .then(data => {

        datos = data;
        mostrarDatos(datos);
        actualizarDashboard(datos);
        actualizarGraficos(datos);
        actualizarGraficoEdades(datos);
        limpiarFormulario();

    });

});

document.querySelector("#cancelar").addEventListener("click", () => {

    usuarioEditando = null;

    limpiarFormulario();

    document.querySelector("#agregar").textContent = "Agregar";
    document.querySelector("#agregar").classList.remove("btn-warning");
    document.querySelector("#agregar").classList.add("btn-success");

    document.querySelector("#cancelar").classList.add("d-none");
    document.querySelector("#titulo-formulario").textContent = "Agregar usuario";

});
</script>

</body>
</html>
